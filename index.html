<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de temperatura</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <main>
        <header>
            <h1>
                Conversor de temperatura
            </h1>
        </header>

        <div id="contenedor-formulario">
            <form id="formulario">
                <label for="temperatura" >Ingresa la temperatura en grados Celsius:</label>
                <input type="text" id="temperatura" placeholder="Ejemplo: 14" required>
                <div id="contenedor-botones">
                    <button id="boton-convertir" type="button">Convertir</button>
                    <button id="boton-limpiar" type="button">Ingresa otro valor</button>
                </div>
            </form>
        </div>
            <div id="resultado"></div>
        </div>

    </main>

    
    <script src="/script.js"></script>
</body>
</html>
